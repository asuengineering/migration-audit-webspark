module:
  name: migration_audit_webspark
  purpose: >
    Produce a normalized Drupal-side migration audit export
    suitable for GPT-based reconciliation against WordPress exports.

operating_model:
  comparison_location: external
  comparison_engine: GPT
  exporter_role: structural_inventory

report:
  families:
    - content
    - taxonomy
    - taxonomy_relationships
    - media
    - menus
    - users
    - forms
    - seo
    - redirects
    - warnings
    - summaries

content_family:
  collection_sources:
    - node
    - block_content
    - layout_builder
    - media_references
    - taxonomy_references
    - path_aliases

  canonical_record:
    export_context:
      platform: string
      export_timestamp: datetime
      environment: string

    object:
      entity_type: string
      bundle: string
      entity_id: integer
      uuid: string
      title: string
      url: string
      published: boolean
      updated: datetime
      author: string

    structure:
      layout_builder_enabled: boolean
      block_count: integer
      inline_block_count: integer
      reusable_block_count: integer
      embedded_component_count: integer
      media_reference_count: integer
      taxonomy_reference_count: integer

    dependencies:
      media_present: boolean
      taxonomy_present: boolean
      reusable_components_present: boolean
      unresolved_dependencies: array

    migration_metadata:
      source_identifier: string
      migration_group: string
      migration_notes: string

    warnings:
      unsupported_components: array
      missing_dependencies: array
      unresolved_references: array

taxonomy_family:
  collection_sources:
    - taxonomy_term
    - taxonomy_relationships
    - path_aliases
    - views_metadata

  canonical_record:
    vocabulary:
      machine_name: string
      label: string

    term:
      term_id: integer
      uuid: string
      label: string
      slug: string
      canonical_url: string

    relationships:
      referenced_content_count: integer

    archive_surface:
      listing_surface_exists: boolean
      listing_surface_type: string
      listing_surface_identifier: string

    warnings:
      missing_listing_surface: boolean
      unresolved_references: array

taxonomy_relationships_family:
  collection_sources:
    - taxonomy_relationships
    - entity_reference_fields

  canonical_record:
    content:
      entity_type: string
      bundle: string
      entity_id: integer
      uuid: string
      title: string
      url: string

    taxonomy:
      vocabulary_machine_name: string
      term_id: integer
      term_label: string
      term_slug: string
      canonical_url: string

    relationship:
      field_name: string
      relationship_exists: boolean

    details_json:
      optional_enrichment: true
      possible_fields:
        - relationship_cardinality
        - parent_term_context
        - field_storage_metadata
        - multi_value_relationship_structure
        - relationship_warnings
        - rendered_relationship_visibility

media_family:
  collection_sources:
    - media_entity
    - file_entity
    - media_references
    - path_aliases

  canonical_record:
    export_context:
      environment: string
      site_id: integer

    media:
      record_type: string
      object_type: string
      object_id: integer
      media_id: integer
      title: string
      url: string
      filename: string
      mime_type: string
      caption: string
      alt_text: string

    migration_validation:
      canonical_asset_present: boolean
      derivative_detected: boolean
      redirect_required: boolean
      referenced_content_count: integer

    details_json:
      optional_enrichment: true
      possible_fields:
        - original_path
        - destination_path
        - file_entity_id
        - media_bundle
        - checksum
        - embedded_in_layout_builder
        - referenced_by

menu_family:
  collection_sources:
    - menu_link_content
    - menu_tree
    - path_aliases

  canonical_record:
    export_context:
      environment: string
      site_id: integer

    menu:
      menu_id: integer
      menu_name: string
      label: string

    item:
      menu_item_id: integer
      title: string
      url: string
      parent_item_id: integer
      weight: integer
      route_name: string
      external_link: boolean

    migration_validation:
      destination_target_present: boolean
      missing_target: boolean
      structure_preserved: boolean

    details_json:
      optional_enrichment: true
      possible_fields:
        - menu_link_entity_id
        - parent_link_id
        - access_flags
        - visibility_flags
        - item_order_source
        - source_destination_mapping

constraints:
  semantic_comparison_supported: false
  revision_analysis_supported: false
  translation_analysis_supported: false
  rendered_markup_export_supported: false
